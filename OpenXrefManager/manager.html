<!DOCTYPE html>
<html>
<head>
  <title>Open XRef Manager</title>
  <link href="modus/modus.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <style>
    body {
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      margin: 0;
      font-size: 0.9rem;
    }
    .list-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1rem;
    }
    .btn .material-icons {
      vertical-align: middle;
      font-size: 1.25rem;
    }
    .action-buttons {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: flex-start; 
    }
    .footer {
      flex-shrink: 0;
    }
    .truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-header, .list-row {
      display: grid;
      grid-template-columns:
        minmax(100px, 1fr)  /* name */
        140px                /* status */
        90px                 /* format */
        minmax(150px, 1fr)  /* path */
        100px                /* pathtype */
        130px                /* timestamp */
        170px;               /* actions */
      gap: 0;
      align-items: center;
      border-bottom: 1px solid #dee2e6;
      padding: 0.5rem 0;
    }
    .list-header {
      font-weight: 600;
    }
    .list-header > div, .list-row > div {
      padding-left: 0.5rem;
      padding-right: 0.5rem;
      box-sizing: border-box;
    }
    .list-row:hover {
      background-color: #f0f2f5;
      cursor: pointer;
    }
    /* Grid Column Alignment */
    .col-format, .col-pathtype {
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .col-actions {
      display: flex;
      align-items: center;
    }
  </style>

</head>
<body>

  <div class="list-container">
    <!-- Grid Header -->
    <div class="list-header">
      <div class="col-name">Xref Name</div>
      <div class="col-status">Status</div>
      <div class="col-format">Format</div>
      <div class="col-path">File Path</div>
      <div class="col-pathtype">Path Type</div>
      <div class="col-timestamp">Last Modified</div>
      <div class="col-actions">Actions</div>
    </div>
    <!-- List Body (will be populated by JS) -->
    <div id="xref-list-body">
    </div>
  </div>

  <div class="footer p-3 bg-light border-top">
    <div class="d-flex justify-content-between">
      
      <button id="purge-button" class="btn btn-outline-secondary">
        <i class="material-icons">delete_sweep</i> Purge Unused
      </button>
      
      <div class="d-flex">
        <button id="refresh-button" class="btn btn-tertiary ml-2" title="Refresh Status">
          <i class="material-icons">refresh</i>
        </button>
        <button id="publish-all-button" class="btn btn-primary ml-2">
          <i class="material-icons">publish</i> Save & Publish All
        </button>
        <button id="close-button" class="btn btn-tertiary ml-2">Close</button>
      </div>
      
    </div>
  </div>


  <script>
    const sketchup = window.sketchup;
    const listBody = document.getElementById('xref-list-body');
    const closeButton = document.getElementById('close-button');
    const publishAllButton = document.getElementById('publish-all-button');
    const purgeButton = document.getElementById('purge-button');
    const refreshButton = document.getElementById('refresh-button'); 

    function formatTimestamp(unix_timestamp) {
      if (!unix_timestamp) {
        return "---";
      }
      const date = new Date(unix_timestamp * 1000); // JS uses milliseconds
      const Y = date.getFullYear();
      const M = ('0' + (date.getMonth() + 1)).slice(-2);
      const D = ('0' + date.getDate()).slice(-2);
      const h = ('0' + date.getHours()).slice(-2);
      const m = ('0' + date.getMinutes()).slice(-2);
      return `${Y}-${M}-${D} ${h}:${m}`;
    }

    function requestDataRefresh() {
      if (sketchup) { sketchup.refresh_data(); }
    }

    function updateTable(xrefData) {
      listBody.innerHTML = '';
      if (xrefData.length === 0) {
        listBody.innerHTML = '<div class="text-center p-4 text-muted">No linked XRefs found in this model.</div>';
        return;
      }
      xrefData.forEach(xref => {
        const row = document.createElement('div');
        row.className = 'list-row';

        row.addEventListener('click', () => {
          if(sketchup) { sketchup.select_component_clicked(xref.name); }
        });

        const nameCol = document.createElement('div');
        nameCol.className = 'col-name';
        nameCol.textContent = xref.name;
        nameCol.title = xref.name;
        row.appendChild(nameCol);

        const statusCol = document.createElement('div');
        statusCol.className = 'col-status';
        let bgClass = '';
        let textClass = 'text-white';
        switch(xref.status_key) {
          case 'ok': bgClass = 'bg-success'; break;
          case 'not_found': textClass = 'text-danger'; break;
          case 'mine': bgClass = 'bg-primary'; break;
          case 'locked': bgClass = 'bg-secondary'; break;
          case 'mine_elsewhere': bgClass = 'bg-warning'; textClass = 'text-dark'; break;
          case 'unloaded': bgClass = 'bg-secondary'; break;
          case 'update_available': bgClass = 'bg-danger'; break;
          default: bgClass = 'bg-light'; textClass = 'text-dark';
        }

        let titleAttr = '';
        if (xref.update_available) {
          let titleText = `File updated at: ${formatTimestamp(xref.file_timestamp)}`;
          if (xref.is_locked && xref.lock_model) {
            titleText += `\nLocked in: ${xref.lock_model}`;
            if (xref.lock_model_path && xref.lock_model_path !== "") {
               titleText += `\nPath: ${xref.lock_model_path}`;
            }
          }
          titleAttr = `title="${titleText}"`;
        } else if (xref.status_key == 'locked' || xref.status_key == 'mine_elsewhere') {
          let titleText = `Locked in: ${xref.lock_model}`;
          if (xref.lock_model_path && xref.lock_model_path !== "") {
             titleText += `\nModified in file: ${xref.lock_model_path}`;
          }
          titleAttr = `title="${titleText}"`;
        }
        statusCol.innerHTML = `<span class="badge ${bgClass} ${textClass}" ${titleAttr}>${xref.status}</span>`;
        row.appendChild(statusCol);

        const formatCol = document.createElement('div');
        formatCol.className = 'col-format';
        let formatBadgeClass = 'badge-secondary';
        if (xref.format === 'skp') {
          formatBadgeClass = 'badge-success';
        } else if (xref.format === 'dwg' || xref.format === 'dxf') {
          formatBadgeClass = 'badge-info';
        }
        formatCol.innerHTML = `<span class="badge ${formatBadgeClass}">${xref.format.toUpperCase()}</span>`;
        formatCol.title = xref.format_name;
        row.appendChild(formatCol);

        const pathCol = document.createElement('div');
        pathCol.className = 'col-path truncate';
        pathCol.textContent = xref.stored_path;
        pathCol.title = xref.path;
        row.appendChild(pathCol);

        const pathTypeCol = document.createElement('div');
        pathTypeCol.className = 'col-pathtype';
        let buttonHTML = '';
        if (xref.path_type === 'relative') {
            buttonHTML = `<button class="btn btn-secondary btn-sm" title="Change to Absolute Path" onclick="sketchup.toggle_path_type_clicked('${xref.name}')">Relative</button>`;
        } else { // absolute
            if (xref.can_be_relative) {
                buttonHTML = `<button class="btn btn-secondary btn-sm" title="Change to Relative Path" onclick="sketchup.toggle_path_type_clicked('${xref.name}')">Absolute</button>`;
            } else {
                buttonHTML = `<button class="btn btn-secondary btn-sm" title="Save the main model to enable relative paths" disabled>Absolute</button>`;
            }
        }
        pathTypeCol.innerHTML = buttonHTML;
        row.appendChild(pathTypeCol);

        const timestampCol = document.createElement('div');
        timestampCol.className = 'col-timestamp small text-muted';
        timestampCol.textContent = formatTimestamp(xref.timestamp);
        row.appendChild(timestampCol);

        const actionsCol = document.createElement('div');
        actionsCol.className = 'col-actions action-buttons';
        actionsCol.addEventListener('click', (event) => {
          event.stopPropagation();
        });

        // Column 1: Lock/Unlock
        let lockButton = '';
        if (xref.is_locked) {
            switch (xref.status_key) {
                case 'mine':
                    // For non-editable formats, show disabled button with tooltip
                    if (!xref.is_editable) {
                        lockButton = `<button class="btn btn-secondary btn-sm" title="Edit in ${xref.format_name}, then reload" disabled><i class="material-icons">lock</i></button>`;
                    } else {
                        lockButton = `<button class="btn btn-primary btn-sm" title="Save & Check In" onclick="sketchup.save_and_check_in_clicked('${xref.name}')"><i class="material-icons">lock</i></button>`;
                    }
                    break;
                case 'mine_elsewhere':
                    // For non-editable formats, show disabled button
                    if (!xref.is_editable) {
                        lockButton = `<button class="btn btn-secondary btn-sm" title="Edit in ${xref.format_name}, then reload" disabled><i class="material-icons">lock</i></button>`;
                    } else {
                        lockButton = `<button class="btn btn-info btn-sm" title="Force Check In" onclick="sketchup.force_check_in_clicked('${xref.name}')"><i class="material-icons">lock</i></button>`;
                    }
                    break;
                case 'locked':
                     lockButton = `<button class="btn btn-info btn-sm" title="Force Unlock" onclick="handleForceUnlockClick('${xref.name}')"><i class="material-icons">no_encryption</i></button>`;
                    break;
                default:
                    // This case should ideally not be hit if is_locked is true, but as a fallback:
                    lockButton = `<button class="btn btn-info btn-sm" disabled><i class="material-icons">lock</i></button>`;
            }
        } else {
            // For non-editable formats, disable checkout button
            if (!xref.is_editable) {
                lockButton = `<button class="btn btn-secondary btn-sm" title="Read-only: Edit in ${xref.format_name}, then reload" disabled><i class="material-icons">lock_open</i></button>`;
            } else {
                lockButton = `<button class="btn btn-info btn-sm" title="Check Out" onclick="sketchup.check_out_clicked('${xref.name}')"><i class="material-icons">lock_open</i></button>`;
            }
        }


        // Column 2: Update/Relink
        let updateButton = '';
        if (xref.update_available) {
            updateButton = `<button class="btn btn-danger btn-sm" title="Update File..." onclick="sketchup.reload_single_clicked('${xref.name}', true)"><i class="material-icons">update</i></button>`;
        } else {
            updateButton = `<button class="btn btn-info btn-sm" title="Replace/Relink File..." onclick="sketchup.relink_clicked('${xref.name}')"><i class="material-icons">link</i></button>`;
        }


        // Column 3: Load/Unload
        let loadButton = '';
        if (xref.found) {
          if (xref.is_unloaded) {
            loadButton = `<button class="btn btn-info btn-sm" title="Load XRef" onclick="sketchup.reload_single_clicked('${xref.name}')"><i class="material-icons">sync</i></button>`;
          } else {
            loadButton = `<button class="btn btn-info btn-sm" title="Unload XRef" onclick="handleUnloadClick('${xref.name}')"><i class="material-icons">visibility_off</i></button>`;
          }
        } else {
            loadButton = `<button class="btn btn-sm" disabled><i class="material-icons">sync_disabled</i></button>`;
        }

        // Column 4: Unlink
        const unlinkButton = `<button class="btn btn-info btn-sm" title="Unlink" onclick="handleUnlinkClick('${xref.name}')"><i class="material-icons">link_off</i></button>`;

        actionsCol.innerHTML = lockButton + updateButton + loadButton + unlinkButton;
        row.appendChild(actionsCol);

        listBody.appendChild(row);
      });
    }

    function handleUnlinkClick(name) {
      // Confirmation handled in Ruby for reliability
      if (sketchup) { sketchup.unlink_single_clicked(name); }
    }

    function handleUnloadClick(name) {
      // Confirmation handled in Ruby for reliability
      if (sketchup) { sketchup.unload_single_clicked(name); }
    }

    function handleForceUnlockClick(name) {
      // Confirmation handled in Ruby for reliability
      if (sketchup) { sketchup.force_unlock_clicked(name); }
    }

    closeButton.onclick = function() { if (sketchup) { sketchup.close_dialog(); } };
    publishAllButton.onclick = function() { if (sketchup) { sketchup.publish_all_clicked(); } };
    purgeButton.onclick = function() {
      // Confirmation handled in Ruby for reliability
      if (sketchup) { sketchup.purge_unused_clicked(); }
    };
    refreshButton.onclick = function() {
      requestDataRefresh();
    };

    window.addEventListener('DOMContentLoaded', function() {
      requestDataRefresh();
    });
  </script>
</body>
</html>
