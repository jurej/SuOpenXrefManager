<!DOCTYPE html>
<html>

<head>
  <title>Open XRef Manager</title>
  <link href="modus/modus.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <style>
    body {
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      margin: 0;
      font-size: 0.9rem;
    }

    .list-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .btn .material-icons {
      vertical-align: middle;
      font-size: 1.25rem;
    }

    .action-buttons {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: flex-start;
      padding: 0.25rem 0;
    }

    .footer {
      flex-shrink: 0;
    }

    .header {
      flex-shrink: 0;
    }

    .truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
      display: inline-block;
      vertical-align: middle;
    }

    /* Table Styles */
    .table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      /* Enforce fixed column widths */
    }

    .table th,
    .table td {
      vertical-align: middle;
      text-align: left;
    }

    .table th {
      font-weight: 600;
      background-color: #fff;
      position: sticky;
      top: 0;
      z-index: 1;
      border-top: none;
    }

    .table tbody tr:hover {
      background-color: #f0f2f5;
      cursor: pointer;
    }

    /* Column Widths */
    .col-name {
      width: 18%;
    }

    .col-status {
      width: 18%;
    }

    .col-path {
      width: 18%;
    }

    .col-pathtype {
      width: 13%;
    }

    .col-timestamp {
      width: 18%;
    }

    .col-actions {
      width: 15%;
    }

    .col-actions.action-buttons {
      padding: 0.25rem 0.75rem !important;
    }

    .cell-truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cell-nowrap {
      white-space: nowrap;
    }
  </style>

</head>

<body>

  <div class="header p-3 bg-light border-bottom d-flex justify-content-between align-items-center">
    <div class="d-flex">
      <button id="set-user-button" class="btn btn-outline-secondary btn-sm" title="Set User Name">
        <i class="material-icons">person</i> Set User
      </button>
      <button id="settings-button" class="btn btn-outline-secondary btn-sm ml-2" title="XRef Manager Settings">
        <i class="material-icons">settings</i> Settings
      </button>
      <button id="pause-monitoring-button" class="btn btn-outline-secondary btn-sm ml-2" title="Pause background monitoring">
        <i class="material-icons">pause</i> Pause Monitoring
      </button>
      <button id="reload-all-button" class="btn btn-outline-secondary btn-sm ml-2" title="Reload All XRefs">
        <i class="material-icons">sync</i> Reload All
      </button>
    </div>

    <div class="d-flex">
      <button id="import-origin-button" class="btn btn-outline-primary btn-sm" title="Import XRef at Origin">
        <i class="material-icons">add_location</i> Import at Origin
      </button>
      <button id="import-place-button" class="btn btn-outline-primary btn-sm ml-2" title="Import XRef (Place)">
        <i class="material-icons">add_location_alt</i> Import & Place
      </button>
      <button id="create-xref-button" class="btn btn-outline-primary btn-sm ml-2" title="Create XRef from Component">
        <i class="material-icons">create_new_folder</i> Create from Component
      </button>
    </div>
  </div>

  <div class="list-container">
    <table class="table">
      <thead>
        <tr>
          <th class="col-name">Xref name</th>
          <th class="col-status">Status</th>
          <th class="col-path">File Path</th>
          <th class="col-pathtype">Path Type</th>
          <th class="col-timestamp">Last Commit</th>
          <th class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody id="xref-list-body">
        <!-- Rows will be populated by JS -->
      </tbody>
    </table>
  </div>

  <div class="footer p-3 bg-light border-top">
    <div class="d-flex justify-content-between">

      <button id="purge-button" class="btn btn-outline-secondary">
        <i class="material-icons">delete_sweep</i> Purge Removed Xref's
      </button>

      <div class="d-flex align-items-center">
        <div class="form-check mr-3">
          <input class="form-check-input" type="checkbox" id="keep-locked-checkbox">
          <label class="form-check-label" for="keep-locked-checkbox">
            Keep locked after publish
          </label>
        </div>
        <button id="refresh-button" class="btn btn-tertiary ml-2" title="Refresh Status">
          <i class="material-icons">refresh</i>
        </button>
        <button id="publish-all-button" class="btn btn-primary ml-2">
          <i class="material-icons">publish</i> Save & Publish All
        </button>
        <button id="close-button" class="btn btn-tertiary ml-2">Close</button>
      </div>

    </div>
  </div>


  <script>
    const sketchup = window.sketchup;
    const listBody = document.getElementById('xref-list-body');
    const closeButton = document.getElementById('close-button');
    const publishAllButton = document.getElementById('publish-all-button');
    const purgeButton = document.getElementById('purge-button');
    const refreshButton = document.getElementById('refresh-button');
    const keepLockedCheckbox = document.getElementById('keep-locked-checkbox');
    const setUserButton = document.getElementById('set-user-button');
    const settingsButton = document.getElementById('settings-button');
    const pauseMonitoringButton = document.getElementById('pause-monitoring-button');
    const reloadAllButton = document.getElementById('reload-all-button');
    const importOriginButton = document.getElementById('import-origin-button');
    const importPlaceButton = document.getElementById('import-place-button');
    const createXrefButton = document.getElementById('create-xref-button');
    
    let monitoringPaused = false;

    function formatTimestamp(unix_timestamp) {
      if (!unix_timestamp) {
        return "---";
      }
      const date = new Date(unix_timestamp * 1000); // JS uses milliseconds
      const Y = date.getFullYear();
      const M = ('0' + (date.getMonth() + 1)).slice(-2);
      const D = ('0' + date.getDate()).slice(-2);
      const h = ('0' + date.getHours()).slice(-2);
      const m = ('0' + date.getMinutes()).slice(-2);
      return `${Y}-${M}-${D} ${h}:${m}`;
    }

    function requestDataRefresh() {
      if (sketchup) { sketchup.refresh_data(); }
    }

    function updateTable(xrefData) {
      listBody.innerHTML = '';
      if (xrefData.length === 0) {
        listBody.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-muted">No linked XRefs found in this model.</td></tr>';
        return;
      }
      xrefData.forEach(xref => {
        const row = document.createElement('tr');

        row.addEventListener('click', () => {
          if (sketchup) { sketchup.select_component_clicked(xref.name); }
        });

        // Name
        const nameCell = document.createElement('td');
        const nameDiv = document.createElement('div');
        nameDiv.className = 'cell-truncate';
        nameDiv.textContent = xref.name;
        nameDiv.title = xref.name;
        nameCell.appendChild(nameDiv);
        row.appendChild(nameCell);

        // Status
        const statusCell = document.createElement('td');
        const statusDiv = document.createElement('div');
        statusDiv.className = 'cell-truncate';

        let bgClass = '';
        let textClass = 'text-white';
        switch (xref.status_key) {
          case 'ok': textClass = 'text-success'; break;
          case 'not_found': textClass = 'text-danger'; break;
          case 'mine': textClass = 'text-primary'; break;
          case 'locked': textClass = 'text-secondary'; break;
          case 'mine_elsewhere': textClass = 'text-warning'; break;
          case 'unloaded': textClass = 'text-secondary'; break;
          case 'update_available': textClass = 'text-danger'; break;
          default: textClass = 'bg-light'; textClass = 'text-dark';
        }

        let titleAttr = '';
        if (xref.update_available) {
          let titleText = `File updated at: ${formatTimestamp(xref.file_timestamp)}`;
          titleText += `\nLast Commit: ${formatTimestamp(xref.timestamp)}`;

          if (xref.is_locked && xref.lock_model) {
            titleText += `\n\nStatus: Locked by ${xref.lock_owner_name}`;
            titleText += `\nIn File: ${xref.lock_model}`;
            if (xref.lock_model_path && xref.lock_model_path !== "") {
              titleText += `\nFile Path: ${xref.lock_model_path}`;
            }
          } else if (xref.last_publisher_name) {
            titleText += `\n\nLast Published by: ${xref.last_publisher_name}`;
            if (xref.last_publisher_path) {
              titleText += `\nFrom Path: ${xref.last_publisher_path}`;
            }
          }
          titleAttr = `title="${titleText}"`;

        } else if (xref.status_key == 'locked' || xref.status_key == 'mine_elsewhere') {
          let titleText = `Last Commit: ${formatTimestamp(xref.timestamp)}`;
          titleText += `\n\nLocked by: ${xref.lock_owner_name}`;
          titleText += `\nIn File: ${xref.lock_model}`;
          if (xref.lock_model_path && xref.lock_model_path !== "") {
            titleText += `\nFile Path: ${xref.lock_model_path}`;
          }
          titleAttr = `title="${titleText}"`;

        } else if (xref.status_key == 'ok' || xref.status_key == 'unloaded' || xref.status_key == 'mine') {
          let titleText = `Last Commit: ${formatTimestamp(xref.timestamp)}`;
          if (xref.last_publisher_name) {
            titleText += `\n\nLast Published by: ${xref.last_publisher_name}`;
            if (xref.last_publisher_path) {
              titleText += `\nFrom Path: ${xref.last_publisher_path}`;
            }
          }
          titleAttr = `title="${titleText}"`;
        } else {
          // For other status keys (like 'not_found'), still show last commit if available
          if (xref.timestamp) {
            let titleText = `Last Commit: ${formatTimestamp(xref.timestamp)}`;
            titleAttr = `title="${titleText}"`;
          }
        }
        statusDiv.innerHTML = `<span class="badge ${bgClass} ${textClass}" ${titleAttr}>${xref.status}</span>`;
        statusCell.appendChild(statusDiv);
        row.appendChild(statusCell);

        // Path
        const pathCell = document.createElement('td');
        const pathDiv = document.createElement('div');
        pathDiv.className = 'cell-truncate';
        pathDiv.textContent = xref.stored_path;
        pathDiv.title = xref.path;
        pathCell.appendChild(pathDiv);
        row.appendChild(pathCell);

        // Path Type
        const pathTypeCell = document.createElement('td');
        const pathTypeDiv = document.createElement('div');
        pathTypeDiv.className = 'cell-truncate';

        let buttonHTML = '';
        if (xref.path_type === 'relative') {
          buttonHTML = `<button class="btn btn-secondary btn-sm" title="Change to Absolute Path" onclick="sketchup.toggle_path_type_clicked('${xref.name}')">Relative</button>`;
        } else { // absolute
          if (xref.can_be_relative) {
            buttonHTML = `<button class="btn btn-secondary btn-sm" title="Change to Relative Path" onclick="sketchup.toggle_path_type_clicked('${xref.name}')">Absolute</button>`;
          } else {
            buttonHTML = `<button class="btn btn-secondary btn-sm" title="Save the main model to enable relative paths" disabled>Absolute</button>`;
          }
        }
        pathTypeDiv.innerHTML = buttonHTML;
        pathTypeCell.appendChild(pathTypeDiv);
        row.appendChild(pathTypeCell);

        // Timestamp
        const timestampCell = document.createElement('td');
        timestampCell.className = 'small text-muted';
        const timestampDiv = document.createElement('div');
        timestampDiv.className = 'cell-truncate';
        timestampDiv.textContent = formatTimestamp(xref.timestamp);
        timestampDiv.title = formatTimestamp(xref.timestamp);
        timestampCell.appendChild(timestampDiv);
        row.appendChild(timestampCell);

        // Actions
        const actionsCell = document.createElement('td');
        actionsCell.className = 'action-buttons';
        actionsCell.addEventListener('click', (event) => {
          event.stopPropagation();
        });

        // Column 1: Lock/Unlock
        let lockButton = '';
        if (xref.is_locked) {
          switch (xref.status_key) {
            case 'mine':
              lockButton = `<button class="btn btn-primary btn-sm" title="Save & Check In" onclick="sketchup.save_and_check_in_clicked('${xref.name}')"><i class="material-icons">save_as</i></button>`;
              break;
            case 'mine_elsewhere':
              lockButton = `<button class="btn btn-info btn-sm" title="Force Check In" onclick="sketchup.force_check_in_clicked('${xref.name}')"><i class="material-icons">lock</i></button>`;
              break;
            case 'locked':
              lockButton = `<button class="btn btn-info btn-sm" title="Force Unlock" onclick="handleForceUnlockClick('${xref.name}')"><i class="material-icons">no_encryption</i></button>`;
              break;
            default:
              lockButton = `<button class="btn btn-info btn-sm" disabled><i class="material-icons">lock</i></button>`;
          }
        } else {
          // Disable Check Out button if XRef is unloaded
          if (xref.is_unloaded) {
            lockButton = `<button class="btn btn-secondary btn-sm" title="Reload XRef first to check out" disabled><i class="material-icons">lock_open</i></button>`;
          } else {
            lockButton = `<button class="btn btn-info btn-sm" title="Check Out" onclick="sketchup.check_out_clicked('${xref.name}')"><i class="material-icons">lock_open</i></button>`;
          }
        }

        // Column 2: Update/Relink
        let updateButton = '';
        if (xref.update_available) {
          // Disable Update button if XRef is unloaded
          if (xref.is_unloaded) {
            updateButton = `<button class="btn btn-secondary btn-sm" title="Reload XRef first to update" disabled><i class="material-icons">update</i></button>`;
          } else {
            updateButton = `<button class="btn btn-danger btn-sm" title="Update File..." onclick="sketchup.reload_single_clicked('${xref.name}', true)"><i class="material-icons">update</i></button>`;
          }
        } else {
          updateButton = `<button class="btn btn-info btn-sm" title="Replace/Relink File..." onclick="sketchup.relink_clicked('${xref.name}')"><i class="material-icons">link</i></button>`;
        }

        // Column 3: Load/Unload
        let loadButton = '';
        if (xref.found) {
          if (xref.is_unloaded) {
            loadButton = `<button class="btn btn-info btn-sm" title="Reload XRef" onclick="sketchup.reload_single_clicked('${xref.name}')"><i class="material-icons">sync</i></button>`;
          } else {
            loadButton = `<button class="btn btn-info btn-sm" title="Unload XRef" onclick="handleUnloadClick('${xref.name}')"><i class="material-icons">visibility_off</i></button>`;
          }
        } else {
          loadButton = `<button class="btn btn-secondary btn-sm" disabled><i class="material-icons">sync_disabled</i></button>`;
        }

        // Column 4: Unlink
        const unlinkButton = `<button class="btn btn-info btn-sm" title="Unlink" onclick="handleUnlinkClick('${xref.name}')"><i class="material-icons">link_off</i></button>`;

        actionsCell.innerHTML = lockButton + updateButton + loadButton + unlinkButton;
        row.appendChild(actionsCell);

        listBody.appendChild(row);
      });
    }

    function handleUnlinkClick(name) {
      sketchup.request_confirmation(`Are you sure you want to unlink "${name}"?\nThis cannot be undone.`, 'confirmUnlink', name);
    }

    function confirmUnlink(name) {
      if (sketchup) { sketchup.unlink_single_clicked(name); }
    }

    function handleUnloadClick(name) {
      sketchup.request_confirmation(`Are you sure you want to unload "${name}"?\n\nThis will remove it from the model to improve performance but keep the link so you can load it back at any time. \n\nAny ucommited changes will be lost.`, 'confirmUnload', name);
    }

    function confirmUnload(name) {
      if (sketchup) { sketchup.unload_single_clicked(name); }
    }

    function handleForceUnlockClick(name) {
      sketchup.request_confirmation(`WARNING: You are about to force unlock a component checked out by another user.\n\nThis can lead to data loss if they are actively working on the file.\n\nAre you sure you want to continue?`, 'confirmForceUnlock', name);
    }

    function confirmForceUnlock(name) {
      if (sketchup) { sketchup.force_unlock_clicked(name); }
    }

    closeButton.onclick = function () { if (sketchup) { sketchup.close_dialog(); } };
    publishAllButton.onclick = function () {
      if (sketchup) {
        const keepLocked = keepLockedCheckbox.checked;
        sketchup.publish_all_clicked(keepLocked.toString());
      }
    };
    purgeButton.onclick = function () {
      sketchup.request_confirmation("Are you sure you want to remove all unused XRefs from this model?\nThis action cannot be undone and will skip any locked files.", 'confirmPurge', '');
    };

    function confirmPurge() {
      if (sketchup) { sketchup.purge_unused_clicked(); }
    }
    refreshButton.onclick = function () {
      requestDataRefresh();
    };

    setUserButton.onclick = function () {
      if (sketchup) { sketchup.set_user_clicked(); }
    };

    settingsButton.onclick = function () {
      if (sketchup) { sketchup.settings_clicked(); }
    };

    pauseMonitoringButton.onclick = function () {
      monitoringPaused = !monitoringPaused;
      if (sketchup) { 
        if (monitoringPaused) {
          sketchup.pause_monitoring_clicked();
          pauseMonitoringButton.innerHTML = '<i class="material-icons">play_arrow</i> Resume Monitoring';
          pauseMonitoringButton.title = 'Resume background monitoring';
          pauseMonitoringButton.classList.remove('btn-outline-secondary');
          pauseMonitoringButton.classList.add('btn-warning');
        } else {
          sketchup.resume_monitoring_clicked();
          pauseMonitoringButton.innerHTML = '<i class="material-icons">pause</i> Pause Monitoring';
          pauseMonitoringButton.title = 'Pause background monitoring';
          pauseMonitoringButton.classList.remove('btn-warning');
          pauseMonitoringButton.classList.add('btn-outline-secondary');
        }
      }
    };

    reloadAllButton.onclick = function () {
      if (sketchup) { sketchup.reload_all_clicked(); }
    };

    importOriginButton.onclick = function () {
      if (sketchup) { sketchup.import_origin_clicked(); }
    };

    importPlaceButton.onclick = function () {
      if (sketchup) { sketchup.import_place_clicked(); }
    };

    createXrefButton.onclick = function () {
      if (sketchup) { sketchup.create_xref_clicked(); }
    };

    function setKeepLockedCheckbox(value) {
      keepLockedCheckbox.checked = value;
    }

    function setMonitoringButtonState(isPaused) {
      monitoringPaused = isPaused;
      if (isPaused) {
        pauseMonitoringButton.innerHTML = '<i class="material-icons">play_arrow</i> Resume Monitoring';
        pauseMonitoringButton.title = 'Resume background monitoring';
        pauseMonitoringButton.classList.remove('btn-outline-secondary');
        pauseMonitoringButton.classList.add('btn-warning');
      } else {
        pauseMonitoringButton.innerHTML = '<i class="material-icons">pause</i> Pause Monitoring';
        pauseMonitoringButton.title = 'Pause background monitoring';
        pauseMonitoringButton.classList.remove('btn-warning');
        pauseMonitoringButton.classList.add('btn-outline-secondary');
      }
    }

    window.addEventListener('DOMContentLoaded', function () {
      // Request saved checkbox preference and monitoring state
      if (sketchup) { 
        sketchup.get_keep_locked_preference();
        sketchup.get_monitoring_state();
      }
      requestDataRefresh();
    });
  </script>
</body>

</html>
