<!DOCTYPE html>
<html>
<head>
  <title>Open XRef Manager</title>
    <link href="modus/modus.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <style>
    body {
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      margin: 0;
      font-size: 0.9rem;
    }
    .list-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1rem;
    }
    .btn .material-icons {
      vertical-align: middle;
      font-size: 1.25rem;
    }
    .action-buttons {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: flex-start; 
    }
    .footer {
      flex-shrink: 0;
    }
    .truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-header, .list-row {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #dee2e6;
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
    }
    .list-header {
      font-weight: 600;
    }
    .list-row:hover {
      background-color: #f0f2f5;
      cursor: pointer;
    }
    /* Flexbox Column Widths */
    .col-name { flex: 1 1 30%; min-width: 100px; max-width: 300px; }
    .col-status { flex: 0 0 140px; }
    .col-path { flex: 1 1 30%; min-width: 150px; }
    .col-pathtype { flex: 0 0 120px; text-align: center; }
    .col-timestamp { flex: 0 0 140px; }
    .col-actions { flex: 0 0 160px; }
  </style>

</head>
<body>

  <div class="list-container">
    <!-- Flexbox Header -->
    <div class="list-header">
      <div class="col-name px-2">Xref name</div>
      <div class="col-status px-2">Status</div>
      <div class="col-path px-2">File Path</div>
      <div class="col-pathtype px-2">Path Type</div>
      <div class="col-timestamp px-2">Last Modified</div> 
      <div class="col-actions px-2">Actions</div>
    </div>
    <!-- List Body (will be populated by JS) -->
    <div id="xref-list-body">
    </div>
  </div>

  <div class="footer p-3 bg-light border-top">
    <div class="d-flex justify-content-end">
      <button id="purge-button" class="btn btn-danger-outline">
        <i class="material-icons">delete_sweep</i> Purge Unused
      </button>
      <button id="refresh-button" class="btn btn-secondary-outline ml-2" title="Refresh Status">
        <i class="material-icons">refresh</i>
      </button>
      <button id="publish-all-button" class="btn btn-primary ml-2">
        <i class="material-icons">publish</i> Save & Publish All
      </button>
      <button id="close-button" class="btn btn-tertiary ml-2">Close</button>
    </div>
  </div>

  <script src="modus/modus-bootstrap.bundle.min.js"></script>

  <script>
    const sketchup = window.sketchup;
    const listBody = document.getElementById('xref-list-body');
    const closeButton = document.getElementById('close-button');
    const publishAllButton = document.getElementById('publish-all-button');
    const purgeButton = document.getElementById('purge-button');
    const refreshButton = document.getElementById('refresh-button'); 

    function formatTimestamp(unix_timestamp) {
      if (!unix_timestamp) {
        return "---";
      }
      const date = new Date(unix_timestamp * 1000); // JS uses milliseconds
      const Y = date.getFullYear();
      const M = ('0' + (date.getMonth() + 1)).slice(-2);
      const D = ('0' + date.getDate()).slice(-2);
      const h = ('0' + date.getHours()).slice(-2);
      const m = ('0' + date.getMinutes()).slice(-2);
      return `${Y}-${M}-${D} ${h}:${m}`;
    }

    function requestDataRefresh() {
      if (sketchup) { sketchup.refresh_data(); }
    }

    function updateTable(xrefData) {
      listBody.innerHTML = '';
      if (xrefData.length === 0) {
        listBody.innerHTML = '<div class="text-center p-4 text-muted">No linked XRefs found in this model.</div>';
        return;
      }
      xrefData.forEach(xref => {
        const row = document.createElement('div');
        row.className = 'list-row';

        // Add a click listener to the entire row to select the component in SketchUp.
        row.addEventListener('click', () => {
          if(sketchup) { sketchup.select_component_clicked(xref.name); }
        });

        // Xref Name Column
        const nameCol = document.createElement('div');
        nameCol.className = 'col-name px-2';
        nameCol.textContent = xref.name;
        nameCol.title = xref.name;
        row.appendChild(nameCol);

        // Status Column
        const statusCol = document.createElement('div');
        statusCol.className = 'col-status px-2';
        let bgClass = '';
        let textClass = 'text-white';
        switch(xref.status_key) {
          case 'ok': bgClass = 'bg-success'; break;
          case 'not_found':
            bgClass = 'bg-danger';
            actionsCol.innerHTML += `<button class="btn btn-warning-outline btn-sm" title="Relink File..." onclick="sketchup.relink_clicked('${xref.name}')"><i class="material-icons">link</i></button>`;
            break;
          case 'mine': bgClass = 'bg-primary'; break;
          case 'locked': bgClass = 'bg-secondary'; break;
          case 'mine_elsewhere': bgClass = 'bg-warning'; textClass = 'text-dark'; break;
          case 'unloaded': bgClass = 'bg-secondary'; break;  
          default: bgClass = 'bg-light'; textClass = 'text-dark';
        }
        let titleAttr = '';
        if ((xref.status_key === 'locked' || xref.status_key === 'mine_elsewhere') && xref.lock_model) {
          let titleText = `Locked in: ${xref.lock_model}`;
          // Add the absolute path if it exists
          if (xref.lock_model_path && xref.lock_model_path !== "") {
             titleText += `\nPath: ${xref.lock_model_path}`;
          }
          titleAttr = `title="${titleText}"`;
        }
        statusCol.innerHTML = `<span class="badge ${bgClass} ${textClass}" ${titleAttr}>${xref.status}</span>`;
        row.appendChild(statusCol);
        
        // File Path Column
        const pathCol = document.createElement('div');
        pathCol.className = 'col-path px-2 truncate';
        pathCol.textContent = xref.stored_path;
        pathCol.title = xref.path;
        row.appendChild(pathCol);

        // Path Type Column
        const pathTypeCol = document.createElement('div');
        pathTypeCol.className = 'col-pathtype px-2';
        let buttonHTML = '';
        if (xref.path_type === 'relative') {
            buttonHTML = `<button class="btn btn-secondary-outline btn-sm" title="Change to Absolute Path" onclick="sketchup.toggle_path_type_clicked('${xref.name}')">Relative</button>`;
        } else { // absolute
            if (xref.can_be_relative) {
                buttonHTML = `<button class="btn btn-secondary-outline btn-sm" title="Change to Relative Path" onclick="sketchup.toggle_path_type_clicked('${xref.name}')">Absolute</button>`;
            } else {
                buttonHTML = `<button class="btn btn-secondary-outline btn-sm" title="Save the main model to enable relative paths" disabled>Absolute</button>`;
            }
        }
        pathTypeCol.innerHTML = buttonHTML;
        row.appendChild(pathTypeCol);
        // Timestamp Column
        const timestampCol = document.createElement('div');
        timestampCol.className = 'col-timestamp px-2 small text-muted';
        timestampCol.textContent = formatTimestamp(xref.timestamp);
        row.appendChild(timestampCol);

        // Actions Column
        const actionsCol = document.createElement('div');
        actionsCol.className = 'col-actions px-2 action-buttons';
        // Stop click event from bubbling up to the row, so clicking a button doesn't also select the component.
        actionsCol.addEventListener('click', (event) => {
          event.stopPropagation();
        });
        actionsCol.innerHTML = '';
        switch (xref.status_key) {
          case 'ok':
            actionsCol.innerHTML += `<button class="btn btn-success-outline btn-sm" title="Check Out" onclick="sketchup.check_out_clicked('${xref.name}')"><i class="material-icons">lock_open</i></button>`;
            break;
          case 'mine':
            actionsCol.innerHTML += `<button class="btn btn-info btn-sm" title="Save & Check In" onclick="sketchup.save_and_check_in_clicked('${xref.name}')"><i class="material-icons">lock</i></button>`;
            break;
          case 'mine_elsewhere':
            actionsCol.innerHTML += `<button class="btn btn-warning btn-sm" title="Force Check In" onclick="sketchup.force_check_in_clicked('${xref.name}')"><i class="material-icons">lock</i></button>`;
            break;
          case 'locked':
            actionsCol.innerHTML += `<span class="text-muted small">Locked</span>`;
            actionsCol.innerHTML += `<button class="btn btn-danger-outline btn-sm" title="Force Unlock" onclick="handleForceUnlockClick('${xref.name}')"><i class="material-icons">no_encryption</i></button>`;
            break;
        }
        actionsCol.innerHTML += `<button class="btn btn-warning-outline btn-sm" title="Replace/Relink File..." onclick="sketchup.relink_clicked('${xref.name}')"><i class="material-icons">link</i></button>`;
        if (xref.found) {
          if (xref.is_unloaded) {
            // Show LOAD button
            actionsCol.innerHTML += `<button class="btn btn-success-outline btn-sm" title="Load XRef" onclick="sketchup.reload_single_clicked('${xref.name}')"><i class="material-icons">sync</i></button>`;
          } else {
            // Show UNLOAD button
            actionsCol.innerHTML += `<button class="btn btn-secondary-outline btn-sm" title="Unload XRef" onclick="handleUnloadClick('${xref.name}')"><i class="material-icons">visibility_off</i></button>`;
          }
        }
        actionsCol.innerHTML += `<button class="btn btn-danger-outline btn-sm" title="Unlink" onclick="handleUnlinkClick('${xref.name}')"><i class="material-icons">link_off</i></button>`;
        row.appendChild(actionsCol);

        listBody.appendChild(row);
      });
    }

    function handleUnlinkClick(name) {
      if (confirm(`Are you sure you want to unlink "${name}"?\nThis cannot be undone.`)) {
        if (sketchup) { sketchup.unlink_single_clicked(name); }
      }
    }

    function handleUnloadClick(name) {
      if (confirm(`Are you sure you want to unload "${name}"?\n\nThis will remove it from the model to improve performance but keep the link so you can load it back at any time. \n\nAny ucommited changes will be lost.`)) {
        if (sketchup) { sketchup.unload_single_clicked(name); }
      }
    }

    function handleForceUnlockClick(name) {
      if (confirm(`WARNING: You are about to force unlock a component checked out by another user.\n\nThis can lead to data loss if they are actively working on the file.\n\nAre you sure you want to continue?`)) {
        if (sketchup) { sketchup.force_unlock_clicked(name); }
      }
    }

    closeButton.onclick = function() { if (sketchup) { sketchup.close_dialog(); } };
    publishAllButton.onclick = function() { if (sketchup) { sketchup.publish_all_clicked(); } };
    purgeButton.onclick = function() {
      if (confirm("Are you sure you want to remove all unused XRefs from this model?\nThis action cannot be undone and will skip any locked files.")) {
        if (sketchup) { sketchup.purge_unused_clicked(); }
      }
    };
    refreshButton.onclick = function() {
      requestDataRefresh();
    };

    window.addEventListener('DOMContentLoaded', function() {
      requestDataRefresh();
    });
  </script>
</body>
</html>
