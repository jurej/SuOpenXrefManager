require:
  - rubocop-sketchup

AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  Exclude:
    - '**/modus/**'
    - '**/icons/**'
    - '**/*.html'

# SketchUp-specific rules
SketchupDeprecations:
  Enabled: true

SketchupPerformance:
  Enabled: true

SketchupSuggestions:
  Enabled: true

SketchupBugs:
  Enabled: true

# Common style preferences
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/MethodLength:
  Max: 50

Metrics/ClassLength:
  Max: 300

Metrics/AbcSize:
  Max: 20

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Layout/IndentationWidth:
  Width: 2

Layout/LineLength:
  Max: 120

Naming/FileName:
  Exclude:
    - 'OpenXrefManager.rb' # Main entry point must match extension name
